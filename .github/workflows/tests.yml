name: Tests

# A chaque envoi : tests des calculs, verification de l'interface, et compilation de l'app.
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Installer MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64
      - name: Tests automatiques
        run: ./tests/run.sh
      - name: Compiler l'app (doit marcher sans avertissement)
        run: |
          ./build.sh 2>&1 | tee build.log
          ! grep -q "warning" build.log

  # Meme app compilee avec Visual Studio (c'est cette version qui est publiee dans les Releases)
  msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Compiler avec MSVC
        shell: cmd
        run: build-msvc.cmd
      - name: Test sur un vrai Windows (l'app demarre et tourne 20 s)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\LuminosityManager.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "L'app s'est arretee (code $($p.ExitCode))"; exit 1 }
          Write-Host "L'app tourne. Memoire : $([math]::Round($p.WorkingSet64 / 1MB, 1)) Mo"
          Stop-Process -Id $p.Id -Force
      - name: Aucune DLL a installer (seulement celles de Windows)
        shell: bash
        run: |
          VS=$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath)
          DUMPBIN=$(find "$VS/VC/Tools/MSVC" -path "*Hostx64/x64/dumpbin.exe" | head -1)
          "$DUMPBIN" //nologo //dependents LuminosityManager.exe | tee deps.txt
          ! grep -iE "vcruntime|msvcp|ucrtbase|api-ms-win-crt" deps.txt
