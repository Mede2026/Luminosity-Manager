name: Release

# Changer le fichier VERSION (ex. 0.1 -> 0.2) compile LuminosityManager.exe et publie une Release GitHub.
on:
  push:
    paths: ['VERSION']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Version de Linux fixee : pas de surprise quand "ubuntu-latest" change
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Installer MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64
      - name: Lire la version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - name: Tests automatiques (pas de Release si un test echoue)
        run: ./tests/run.sh
      - name: Compiler
        run: ./build.sh
      - name: Empreinte SHA-256 (l'app verifie les mises a jour avec)
        run: sha256sum LuminosityManager.exe > LuminosityManager.exe.sha256
      - name: Publier la Release
        # Outil officiel "gh" (deja installe) : pas d'action externe a tenir a jour
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Télécharge **LuminosityManager.exe** ci-dessous et double-clique dessus. Aucune installation.
          Si une version précédente est déjà installée, elle se met à jour toute seule (page « Mises à jour »).

          Nouveautés et mode d'emploi : voir le [README](https://github.com/${{ github.repository }}#readme).
          EOF
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            # la Release existe deja (relance) : on remplace juste le .exe
            gh release upload "v$VERSION" LuminosityManager.exe LuminosityManager.exe.sha256 --clobber
          else
            gh release create "v$VERSION" LuminosityManager.exe LuminosityManager.exe.sha256 --target "$GITHUB_SHA" \
              --title "Luminosity Manager $VERSION" --notes-file notes.md
          fi
