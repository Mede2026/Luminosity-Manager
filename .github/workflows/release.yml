name: Release

# Changer le fichier VERSION (ex. 0.1 -> 0.2) : tests, compilation avec Visual Studio, test sur Windows,
# puis publication de la Release GitHub.
on:
  push:
    paths: ['VERSION']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    # Version de Linux fixee : pas de surprise quand "ubuntu-latest" change
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tests automatiques (pas de Release si un test echoue)
        run: ./tests/run.sh

  release:
    needs: tests
    # Compile avec Visual Studio (MSVC) : moins souvent pris pour un virus que MinGW
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Lire la version
        shell: bash
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - name: Compiler avec MSVC
        shell: cmd
        run: build-msvc.cmd
      - name: Test sur un vrai Windows (l'app demarre et tourne 20 s)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\LuminosityManager.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "L'app s'est arretee (code $($p.ExitCode))"; exit 1 }
          Write-Host "L'app tourne. Memoire : $([math]::Round($p.WorkingSet64 / 1MB, 1)) Mo"
          Stop-Process -Id $p.Id -Force
      - name: Empreinte SHA-256 (l'app verifie les mises a jour avec)
        shell: bash
        run: sha256sum LuminosityManager.exe > LuminosityManager.exe.sha256
      - name: Publier la Release
        # Outil officiel "gh" (deja installe) : pas d'action externe a tenir a jour
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Télécharge **LuminosityManager.exe** ci-dessous, double-clique dessus, puis clique sur **Installer** (pas besoin d'être administrateur).
          Si une version précédente est déjà installée, elle se met à jour toute seule (page « Mises à jour »).

          Nouveautés et mode d'emploi : voir le [README](https://github.com/${{ github.repository }}#readme).
          EOF
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            # la Release existe deja (relance) : on remplace juste le .exe
            gh release upload "v$VERSION" LuminosityManager.exe LuminosityManager.exe.sha256 --clobber
          else
            gh release create "v$VERSION" LuminosityManager.exe LuminosityManager.exe.sha256 --target "$GITHUB_SHA" \
              --title "Luminosity Manager $VERSION" --notes-file notes.md
          fi
